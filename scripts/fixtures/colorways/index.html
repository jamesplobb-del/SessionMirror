<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BestTake · Color studies</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#192c42;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}header{max-width:1420px;margin:auto;padding:30px 28px 18px}h1{font-size:30px;letter-spacing:-1px;margin:5px 0 10px;font-weight:600}p{font-size:14px;color:#596b7d;line-height:1.5;margin:6px 0}small{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#637286}nav{display:flex;gap:8px;margin-top:18px}button{border:1px solid #d4dde7;border-radius:20px;padding:10px 18px;background:white;color:#314c69;font:inherit;font-size:13px;cursor:pointer}button[aria-pressed=true]{background:#203b58;color:white;border-color:#203b58}.grid{display:grid;grid-template-columns:repeat(4,280px);justify-content:center;gap:24px;padding:8px 24px 35px}article h2{font-size:18px;letter-spacing:-.4px;margin:7px 0;font-weight:600}article p{min-height:43px;font-size:12px}.swatches{display:flex;gap:5px;margin:12px 0}.swatches i{display:block;width:21px;height:21px;border-radius:50%;border:1px solid #0000000c}.phone{width:280px;height:607px;overflow:hidden;border-radius:32px;border:1px solid #cbd3dc;background:white;box-shadow:0 8px 24px #203b580a}iframe{width:390px;height:845px;transform:scale(.71795);transform-origin:top left;border:0;display:block}.badge{color:#2863e8;font-size:11px;font-weight:600}@media(max-width:1250px){.grid{grid-template-columns:repeat(2,280px)}}@media(max-width:610px){.grid{grid-template-columns:280px}header{padding:22px}h1{font-size:26px}}
</style></head><body><header><small>BestTake · Color studies</small><h1>Same app. Four different moods.</h1><p>Real Home and recording screens, recolored for comparison. These alternatives are previews only.</p><nav aria-label="Preview screen"><button data-screen="home" aria-pressed="true">Home</button><button data-screen="audio" aria-pressed="false">Audio recording</button></nav></header><main class="grid"></main><script>
const palettes=[['','Blue & Gold','Your brighter current palette. Familiar and energetic.',['#ffffff','#007ee5','#efa91b','#59caff']],['coral','Cobalt & Coral','Crisp blue with a warmer, more human accent.',['#fffdfc','#2863e8','#ed8a78','#a6c6ff']],['teal','Teal & Apricot','Fresh and relaxed. A softer mood for long sessions.',['#fcfefc','#008776','#efb276','#80d9c8']],['indigo','Indigo & Lilac','A creative studio feel, with a cooler personality.',['#fdfcff','#5a50db','#b886d0','#bdb7ff']]];
function url(id,screen){return '../app-design/frame.html?finish=glass&dark=0&screen='+screen+(id?'&colorway='+id:'')}
for(const [id,name,description,colors] of palettes){const a=document.createElement('article');a.innerHTML='<span class="badge">'+(id==='coral'?'My first pick':id?'Alternative':'Current · brighter')+'</span><h2>'+name+'</h2><p>'+description+'</p><div class="swatches">'+colors.map(c=>'<i style="background:'+c+'"></i>').join('')+'</div><div class="phone"><iframe title="'+name+' preview" src="'+url(id,'home')+'"></iframe></div>';a.dataset.palette=id;document.querySelector('main').append(a)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('article').forEach(a=>a.querySelector('iframe').src=url(a.dataset.palette,b.dataset.screen))});
</script></body></html>
