<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BestTake · Tuner concepts</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#142b43;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}header{max-width:1200px;margin:auto;padding:28px 24px 18px}h1{font-size:28px;letter-spacing:-.8px;margin:8px 0}p{font-size:13px;line-height:1.5;color:#586d81}small{font-size:11px;letter-spacing:1px;color:#61758a}nav{display:flex;gap:7px;flex-wrap:wrap}button{font:inherit;font-size:12px;cursor:pointer;border:1px solid #d5e3ef;background:white;color:#345b7e;border-radius:20px;padding:10px 15px}button[aria-pressed=true]{background:#142b43;color:white;border-color:#142b43}.grid{display:grid;grid-template-columns:repeat(3,350px);gap:24px;justify-content:center;padding:4px 24px 30px}article h2{font-size:20px;letter-spacing:-.5px;margin:8px 0}article>p{min-height:40px;margin:0 0 15px}.phone{--ink:#142b43;--muted:#526b83;--line:#d8e6f2;--soft:#f2f8ff;--panel:white;width:350px;height:710px;border:1px solid var(--line);border-radius:34px;background:var(--panel);overflow:hidden;padding:22px 18px 15px;display:flex;flex-direction:column;color:var(--ink)}.dark .phone{--ink:#edf5fc;--muted:#9fb4c8;--line:#34516a;--soft:#21394d;--panel:#101e2c}.tabs{display:flex;background:var(--soft);padding:4px;border:1px solid var(--line);border-radius:24px;gap:3px}.tabs span{flex:1;text-align:center;padding:9px 0;font-size:11px;color:var(--muted)}.tabs .active{background:var(--panel);border-radius:20px;color:#0789e8;font-weight:600}.tip{margin:24px 0 8px;font-size:11px;color:var(--muted);text-align:center;line-height:1.5}.readout{text-align:center;padding:7px 0 20px}.note{font-size:72px;font-weight:500;line-height:1.1;letter-spacing:-4px}.note sup{font-size:30px;vertical-align:top;position:relative;top:11px;letter-spacing:0}.reading{font-size:14px;font-variant-numeric:tabular-nums;margin-top:6px}.reading b{font-weight:600;color:var(--pitch)}.reading span{font-size:11px;color:var(--muted);margin-left:10px}.graph{position:relative;flex:1;min-height:180px;display:flex;align-items:stretch;margin:0 -1px 18px}.graph svg{width:100%;height:100%;overflow:visible}.axis{position:absolute;left:0;font-size:8px;font-weight:600;letter-spacing:.9px;color:var(--muted)}.sharp{top:9%}.target{top:49%;transform:translateY(-50%)}.flat{bottom:9%}.axis:has(+*){pointer-events:none}.tools{display:flex;justify-content:center;gap:35px;padding:4px 0 24px}.tools div{text-align:center;font-size:10px;color:var(--muted);display:grid;gap:7px;justify-items:center}.icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.dock{border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:15px 0 8px}.dock>div{display:grid;justify-items:center;gap:6px;font-size:9px;color:#0789e8}.record{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}.record i{width:34px;height:34px;background:#ed5964;border-radius:50%}.homebar{width:110px;height:4px;background:var(--ink);opacity:.25;margin:9px auto 0;border-radius:3px}.rail .graph{border:1px solid var(--line);border-radius:22px;padding:22px 9px 8px;margin-bottom:18px}.rail .axis{left:10px}.rail .graph::before{content:'PITCH HISTORY';position:absolute;top:10px;left:14px;font-size:8px;letter-spacing:1px;color:var(--muted)}.ribbon .graph{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.ribbon .note{font-weight:400}.tag{color:#0789e8;font-size:11px;font-weight:600}.hint{text-align:center;font-size:10px;color:var(--muted);margin:0 0 17px}.dark{background:#172331;color:#edf5fc}.dark header p,.dark article>p{color:#a5b8c9}@media(max-width:1170px){.grid{grid-template-columns:repeat(2,350px)}}@media(max-width:760px){.grid{grid-template-columns:350px}}@media(prefers-reduced-motion:no-preference){/* Deliberately no continuous animation in this review. */}
/* Color feedback is shared by the whole screen and trace. No blur or animated layers. */
article[data-pitch="center"] { --wash:#c3f8d9; --wash-dark:#103d2d; --pitch:#008d50; --pitch-dark:#42ef9a; }
article[data-pitch="flat"] { --wash:#fff0a6; --wash-dark:#40350e; --pitch:#a57600; --pitch-dark:#ffdc47; }
article[data-pitch="sharp"] { --wash:#ffc9c2; --wash-dark:#452224; --pitch:#d3383d; --pitch-dark:#ff7c77; }
.phone { background:var(--wash); border-color:color-mix(in srgb,var(--pitch) 24%,var(--line)); --muted:#405c66; }
.dark .phone { background:var(--wash-dark); --pitch:var(--pitch-dark); --muted:#c0d1d6; }
.tabs { background:color-mix(in srgb,var(--panel) 78%,transparent); }
.tabs .active { color:var(--ink); }
.rail .graph { background:color-mix(in srgb,var(--panel) 55%,transparent); border-color:color-mix(in srgb,var(--pitch) 22%,var(--line)); }
.ribbon .graph { border-color:color-mix(in srgb,var(--pitch) 25%,transparent); }
.trace { stroke-width:2.8; }
.dot { stroke-width:2; }
.dock { border-top-color:color-mix(in srgb,var(--ink) 12%,transparent); }
.dock>div { color:var(--ink); }
@media(prefers-reduced-motion:no-preference) {
  .phone { transition:background-color 420ms ease,border-color 420ms ease; }
  .trace { transition:stroke 420ms ease; }
  .dot,.area { transition:fill 420ms ease; }
  .reading b { transition:color 420ms ease; }
}
/* Stronger Air studies; still static and isolated from the tuner. */
.rail .tip { text-align:left; margin:22px 4px 16px; }
.rail .readout { display:flex; align-items:center; justify-content:space-between; padding:0 4px 18px; border-bottom:1px solid color-mix(in srgb,var(--ink) 14%,transparent); }
.rail .note { font-size:52px; letter-spacing:-2px; }
.rail .note sup { font-size:23px; top:8px; }
.rail .reading { display:flex; flex-direction:column; text-align:right; gap:4px; margin:0; }
.rail .reading b { font-size:27px; letter-spacing:-1px; font-weight:500; }
.rail .reading span { font-size:11px; margin:0; }
.rail .graph { margin:16px -6px 16px; padding:0; border:0; border-radius:0; background:transparent; min-height:260px; }
.rail .graph::before { content:none; }
.rail .axis { left:0; font-size:9px; }
.rail .trace { stroke-width:2; }
.rail .dot { r:5; }
.rail .tools { padding:12px 0 20px; border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent); }
.ribbon .tip { margin-top:18px; margin-bottom:0; }
.ribbon .readout { padding:8px 0 19px; }
.ribbon .note { font-size:88px; font-weight:500; line-height:1; }
.ribbon .reading { display:flex; align-items:center; justify-content:center; gap:10px; }
.ribbon .reading b { background:color-mix(in srgb,var(--panel) 58%,transparent); padding:6px 12px; border-radius:10px; }
.ribbon .reading span { margin-left:0; }
.ribbon .graph { background:color-mix(in srgb,var(--panel) 72%,transparent); border:1px solid color-mix(in srgb,var(--pitch) 20%,var(--line)); border-radius:25px; padding:18px 10px; margin:0 0 20px; }
.ribbon .axis { left:12px; font-size:8px; }
.ribbon .area { opacity:0; }
.ribbon .trace { stroke-width:2.5; }
.ribbon .dot { r:5; }
.ribbon .tools { gap:42px; }
</style></head><body><header><small>BESTTAKE · TUNER STUDIES</small><h1>Make the graph the instrument.</h1><p>Original Air beside two stronger directions. Same pitch colors; different hierarchy and graph treatment. Preview only — the working tuner is unchanged.</p><nav aria-label="Example pitch"><button data-pitch="center" aria-pressed="true">In tune</button><button data-pitch="flat" aria-pressed="false">Flat</button><button data-pitch="sharp" aria-pressed="false">Sharp</button><button id="theme" aria-pressed="false">Dark mode</button></nav></header><main class="grid"></main><script>
const icons={home:'<path d="M3 10l9-7 9 7v11h-6v-7H9v7H3z"/>',workspace:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 3v18M3 12h18"/>',settings:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>',record:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',drone:'<path d="M3 12h3l2-7 4 14 4-14 2 7h3"/>',insights:'<path d="M4 3v17h17M8 15v-4m5 4V6m5 9V9"/>',tuning:'<path d="M5 3v18M12 3v18M19 3v18M2 8h6m1 8h6m1-10h6"/>'};
const icon=k=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+icons[k]+'</svg>';
const designs=[['air','Original Air','For comparison','Full-screen pitch color with an open graph and a clear matching trace.'],['rail','Air · Wide Graph','More room for the music','A compact note readout gives the graph center stage. A wider trace is easier to read at a glance.'],['ribbon','Air · Focus Frame','A more defined instrument','A larger note and a framed graph separate the pitch reading from its history.']];
for(const [id,name,tag,copy] of designs){const a=document.createElement('article');a.className=id;a.innerHTML='<span class="tag">'+tag+'</span><h2>'+name+'</h2><p>'+copy+'</p><div class="phone"><div class="tabs"><span class="active">Tuner</span><span>Metronome</span><span>Games</span></div><div class="tip">You tend slightly sharp on A.<br>Sample insight · from your playing history</div><div class="readout"><div class="note">A<sup>4</sup></div><div class="reading"><b></b><span></span></div></div><div class="graph"><span class="axis sharp">SHARP</span><span class="axis target">TARGET</span><span class="axis flat">FLAT</span><svg viewBox="0 0 300 220" preserveAspectRatio="none" aria-label="Illustrative pitch history"><rect x="46" y="98" width="250" height="24" rx="10" fill="#21ac79" opacity=".07"/><path d="M46 110H296" stroke="var(--line)" stroke-width="1"/><path class="area" fill="var(--pitch)" opacity=".08"/><path class="trace" fill="none" stroke="var(--pitch)" stroke-width="'+(id==='rail'?'2.4':'2')+'" stroke-linecap="round" stroke-linejoin="round"/><circle class="dot" r="4" fill="var(--pitch)" stroke="var(--panel)" stroke-width="2"/></svg></div><div class="tools">'+['drone','insights','tuning'].map(k=>'<div>'+icon(k)+'<span>'+k[0].toUpperCase()+k.slice(1)+'</span></div>').join('')+'</div><div class="dock"><div>'+icon('home')+'Home</div><div>'+icon('workspace')+'Workspace</div><div class="record"><i></i></div><div>'+icon('record')+'Record</div><div>'+icon('settings')+'Settings</div></div><div class="homebar"></div></div>';document.querySelector('main').append(a)}
function draw(state){const cfg={center:['#15966c',0,'+1¢','440.3 Hz'],flat:['#bc8611',36,'−18¢','435.4 Hz'],sharp:['#e05d58',-36,'+18¢','444.6 Hz']}[state];document.querySelectorAll('article').forEach(a=>{a.dataset.pitch=state;const points=Array.from({length:67},(_,i)=>{const x=47+i*3.5;const y=110+cfg[1]+Math.sin(i*.3)*5+Math.sin(i*.83)*2+Math.sin(i*.09)*9;return [x,y]});const d=points.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' ');a.querySelector('.trace').setAttribute('d',d);a.querySelector('.area').setAttribute('d',a.className==='ribbon'?d+'L278 110L47 110Z':'');const last=points.at(-1);a.querySelector('.dot').setAttribute('cx',last[0]);a.querySelector('.dot').setAttribute('cy',last[1]);a.querySelector('.reading b').textContent=cfg[2];a.querySelector('.reading span').textContent=cfg[3]})}
document.querySelectorAll('[data-pitch]').forEach(b=>b.onclick=()=>{draw(b.dataset.pitch);document.querySelectorAll('[data-pitch]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});document.querySelector('#theme').onclick=e=>{const dark=document.body.classList.toggle('dark');e.currentTarget.setAttribute('aria-pressed',String(dark));e.currentTarget.textContent=dark?'Light mode':'Dark mode'};draw('center');
</script></body></html>
