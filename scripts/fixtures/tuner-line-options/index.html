<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BestTake · Tuner line options</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f8;color:#18324b;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}main{max-width:1260px;margin:auto;padding:26px 24px}h1{font-size:28px;letter-spacing:-.8px;font-weight:600;margin:8px 0}header>p{font-size:13px;color:#526b81;line-height:1.5;max-width:680px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#526b81}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}button,a{font:inherit;font-size:12px;border:1px solid #d7e3ec;background:white;color:#18324b;padding:10px 15px;min-height:42px;border-radius:12px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#18324b;color:white;border-color:#18324b}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}article{min-width:0}h2{font-size:20px;letter-spacing:-.4px;font-weight:600;margin:0 0 7px}article>p{font-size:12px;color:#526b81;line-height:1.5;min-height:36px;margin:0 0 13px}.device{border-radius:30px;overflow:hidden;position:relative;border:1px solid #d7e3ec;background:white;width:100%;box-shadow:0 10px 30px #18324b0a}iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left;width:390px;height:800px}article>a{display:block;text-align:center;margin-top:12px}.mobile-tabs{display:none}.dark{background:#152333;color:#eef7ff}.dark header>p,.dark article>p,.dark .eyebrow{color:#bed0de}.dark button,.dark a{background:#284159;border-color:#3c566f;color:#eff8ff}.dark button[aria-pressed=true]{background:#eff8ff;color:#18324b}@media(max-width:1050px){main{max-width:650px;padding:22px 16px}.grid{grid-template-columns:minmax(0,390px);justify-content:center}.mobile-tabs{display:flex;gap:7px;margin:0 0 20px}.mobile-tabs button{flex:1;padding-inline:8px}article:not(.selected){display:none}}
</style></head><body><main><header><div class="eyebrow">BestTake / Actual tuner components</div><h1>Clearer lines. No ribbons.</h1><p>Three alternatives in the real app layout. Same pitch history, same screen color, no graph labels or glow. Pitch input is simulated; phone rendering still needs an on-device check.</p></header><div class="controls"><button id="light" aria-pressed="true">Light</button><button id="dark" aria-pressed="false">Dark</button><button id="size">390 px phone</button></div><nav class="mobile-tabs" aria-label="Line design"><button data-style="clean" aria-pressed="true">A · Clean</button><button data-style="beads" aria-pressed="false">B · Points</button><button data-style="focus" aria-pressed="false">C · Focus</button></nav><div class="grid"></div></main>
<script>
const options=[['clean','A · Clean line','A consistent, rounded stroke. The entire line stays readable.'],['beads','B · Connected points','A fine connected line with clear markers along the measured pitch.'],['focus','C · Focus head','A clean line with a strong current-pitch marker. Older history recedes.']];let dark=false,width=390,selected='clean';const grid=document.querySelector('.grid');
for(const [id,name,copy]of options){const a=document.createElement('article');a.dataset.style=id;a.className=id===selected?'selected':'';a.innerHTML=`<h2>${name}</h2><p>${copy}</p><div class="device"><iframe title="${name} production component preview" loading="eager"></iframe></div><a target="_blank" rel="noopener">Open at full size ↗</a>`;grid.append(a)}
function resize(){document.querySelectorAll('article').forEach(a=>{const d=a.querySelector('.device');if(!d.clientWidth)return;const scale=d.clientWidth/width;const f=a.querySelector('iframe');f.style.width=width+'px';f.style.height='800px';f.style.transform=`scale(${scale})`;d.style.height=(800*scale)+'px'})}
function load(){document.body.classList.toggle('dark',dark);document.querySelector('#light').setAttribute('aria-pressed',String(!dark));document.querySelector('#dark').setAttribute('aria-pressed',String(dark));document.querySelectorAll('article').forEach(a=>{const url='../app-design/frame.html?screen=tuner&finish=glass&traceStudy='+a.dataset.style+'&dark='+(dark?'1':'0');a.querySelector('iframe').src=url;a.querySelector('a').href=url});resize()}
document.querySelectorAll('.mobile-tabs button').forEach(b=>b.onclick=()=>{selected=b.dataset.style;document.querySelectorAll('article').forEach(a=>a.classList.toggle('selected',a.dataset.style===selected));document.querySelectorAll('.mobile-tabs button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));resize()});document.querySelector('#light').onclick=()=>{dark=false;load()};document.querySelector('#dark').onclick=()=>{dark=true;load()};document.querySelector('#size').onclick=e=>{width=width===390?430:390;e.currentTarget.textContent=width+' px phone';resize()};new ResizeObserver(resize).observe(grid);load();
</script></body></html>
