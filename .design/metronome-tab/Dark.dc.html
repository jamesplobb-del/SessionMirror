<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg: #0b1220;
      --surface: #141d2e;
      --text-primary: #f8fafc;
      --text-secondary: #aab3c2;
      --blue: #1598ff;
      --gold: #f7a600;
      --hairline: rgba(226, 232, 240, 0.1);
      --shadow-fab: 0 10px 28px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      --shadow-card: 0 16px 42px rgba(0, 0, 0, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      --shadow-segment: 0 14px 34px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--blue); }
    a:hover { color: #7dd3fc; }

    .screen {
      width: 390px;
      min-height: 844px;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .safe-top { height: 14px; flex: 0 0 auto; }

    /* —— Segmented top tabs —— */
    .tabs {
      display: flex;
      align-items: stretch;
      gap: 2px;
      width: calc(100% - 24px);
      max-width: 448px;
      margin: 11px auto 15px;
      padding: 4px;
      border-radius: 21.6px;
      background: var(--surface);
      box-shadow: var(--shadow-segment);
    }
    .tabs__btn {
      flex: 1 1 0;
      min-width: 0;
      min-height: 36.8px;
      padding: 6px 3px;
      border: 1.5px solid transparent;
      border-radius: 18.7px;
      background: transparent;
      color: var(--text-secondary);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .tabs__btn--active {
      border-color: var(--gold);
      color: var(--gold);
    }
    .tabs__beta { font-size: 0.62em; font-weight: 700; letter-spacing: 0; opacity: 0.72; }

    /* —— Body —— */
    .body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 4px 10px 0;
      min-height: 0;
    }

    /* —— Tempo card —— */
    .tempo-card {
      width: 100%;
      margin-inline: auto;
      padding: 11px 12px 0;
      border: 1px solid rgba(226, 232, 240, 0.09);
      border-radius: 21.6px;
      background: radial-gradient(circle at 50% 0%, rgba(247, 166, 0, 0.075), transparent 42%), var(--surface);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045), 0 18px 45px rgba(0, 0, 0, 0.22);
    }

    .tempo-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      padding: 0 2px 6px;
    }

    .step {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 47px;
      height: 47px;
      padding: 0;
      border-radius: 999px;
      border: 1.5px solid rgba(226, 232, 240, 0.12);
      background: var(--surface);
      color: var(--text-primary);
      box-shadow: var(--shadow-fab);
    }
    .step svg { width: 20px; height: 20px; }

    .scrubber {
      position: relative;
      display: grid;
      place-items: center;
      flex: 0 1 216px;
      min-width: 144px;
      min-height: 92px;
      padding-inline: 12px;
      overflow: visible;
    }
    .bpm { display: flex; flex-direction: column; align-items: center; }
    .tempo-label {
      margin-bottom: 7px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1;
      color: var(--gold);
    }
    .bpm-value {
      font-size: 74px;
      font-weight: 800;
      line-height: 0.82;
      letter-spacing: -0.055em;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      text-shadow: 0 8px 22px rgba(21, 152, 255, 0.11);
    }
    .drag-cue {
      position: absolute;
      right: 2px;
      top: 50%;
      width: 17px;
      height: 17px;
      transform: translateY(-50%);
      color: color-mix(in srgb, var(--blue) 68%, var(--gold));
      opacity: 0.42;
    }

    /* —— Selector footer —— */
    .selectors {
      width: calc(100% + 24px);
      margin: 0 -12px;
      padding: 6px 0 0;
      border-top: 1px solid rgba(226, 232, 240, 0.1);
      border-radius: 0 0 21.6px 21.6px;
      background: rgba(226, 232, 240, 0.018);
    }
    .sel-row {
      display: grid;
      grid-template-columns: minmax(0, 0.72fr) minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, 1fr);
      width: 100%;
    }
    .sel {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 40.8px;
      padding: 17px 5px 6px;
    }
    .sel + .sel { border-left: 1px solid rgba(226, 232, 240, 0.085); }
    .sel-label {
      position: absolute;
      top: 6px;
      left: 50%;
      width: calc(100% - 12px);
      transform: translateX(-50%);
      text-align: center;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sel-val {
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .sel-val .spacer { width: 12.5px; flex: 0 0 12.5px; }
    .sel-val .txt { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .sel-val svg { width: 12.5px; height: 11px; flex: 0 0 12.5px; color: var(--text-secondary); }

    /* —— Visual stage: Bars view (the beat "runway") —— */
    .visual {
      position: relative;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 466px;
      padding: 29px 12px;
      overflow: visible;
      isolation: isolate;
    }
    .visual::before {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      top: 50%;
      height: 192px;
      transform: translateY(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(30, 41, 59, 0.42) 0%, rgba(56, 189, 248, 0.045) 48%, transparent 76%);
      z-index: 0;
      pointer-events: none;
    }
    .visual::after {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      top: 50%;
      height: 2px;
      transform: translateY(-1px);
      background: linear-gradient(90deg, rgba(247, 166, 0, 0.62), rgba(56, 189, 248, 0.46) 28%, rgba(125, 211, 252, 0.18));
      z-index: 1;
      pointer-events: none;
    }
    .beat-row {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      width: min(100%, 363px);
      gap: 6px;
    }
    .beat {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 316px;
      border-radius: 14px;
      border: 1.5px solid rgba(148, 163, 184, 0.18);
      background: var(--surface);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 8px 18px rgba(0, 0, 0, 0.22);
    }
    .beat span {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
    }
    .beat--down {
      height: 322px;
      border-color: rgba(247, 166, 0, 0.72);
      box-shadow: 0 0 0 1px rgba(247, 166, 0, 0.16), var(--shadow-fab);
    }
    .beat--down span { color: var(--gold); }

    /* —— Transport —— */
    .transport {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 384px;
      margin: 0 auto;
      padding: 6px 0 34px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      max-width: 184px;
      min-height: 44px;
      padding-inline: 14px;
      border-radius: 999px;
      border: 1.5px solid var(--hairline);
      background: var(--surface);
      color: var(--text-primary);
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: var(--shadow-fab);
    }
    .pill svg { width: 20px; height: 20px; }
    .pill.program { justify-self: end; }
    .pill.tap { justify-self: start; }
    .play {
      justify-self: center;
      display: grid;
      place-items: center;
      width: 51px;
      height: 51px;
      padding: 0;
      border-radius: 999px;
      border: 1.5px solid var(--blue);
      background: var(--surface);
      color: var(--blue);
      box-shadow: var(--shadow-fab);
    }
    .play svg { width: 22px; height: 22px; }
  </style>
</helmet>

<div class="screen">
  <div class="safe-top"></div>

  <nav class="tabs" aria-label="Audio practice tools">
    <button type="button" class="tabs__btn">Audio</button>
    <button type="button" class="tabs__btn tabs__btn--active" aria-current="page">Metronome</button>
    <button type="button" class="tabs__btn">Tuner</button>
    <button type="button" class="tabs__btn">Games<span class="tabs__beta"> (Beta)</span></button>
  </nav>

  <div class="body">
    <section class="tempo-card">
      <div class="tempo-strip">
        <button type="button" class="step" aria-label="Decrease tempo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
        </button>

        <div class="scrubber" role="group" aria-label="120 beats per minute. Swipe up or down to change tempo.">
          <div class="bpm">
            <span class="tempo-label">&#9833; = BPM</span>
            <span class="bpm-value">120</span>
          </div>
          <svg class="drag-cue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
        </div>

        <button type="button" class="step" aria-label="Increase tempo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
      </div>

      <div class="selectors" aria-label="Metronome time, rhythm, and accent">
        <div class="sel-row" data-control-count="4">
          <div class="sel">
            <span class="sel-label">Time</span>
            <span class="sel-val"><span class="spacer"></span><span class="txt">4/4</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
          </div>
          <div class="sel">
            <span class="sel-label">Rhythm</span>
            <span class="sel-val"><span class="spacer"></span><span class="txt">Quarter</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
          </div>
          <div class="sel">
            <span class="sel-label">Sound</span>
            <span class="sel-val"><span class="spacer"></span><span class="txt">Classic</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
          </div>
          <div class="sel">
            <span class="sel-label">View</span>
            <span class="sel-val"><span class="spacer"></span><span class="txt">Bars</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
          </div>
        </div>
      </div>
    </section>

    <div class="visual">
      <div class="beat-row" role="group" aria-label="Beat indicators">
        <div class="beat beat--down"><span>1</span></div>
        <div class="beat"><span>2</span></div>
        <div class="beat"><span>3</span></div>
        <div class="beat"><span>4</span></div>
      </div>
    </div>

    <footer class="transport" aria-label="Metronome transport">
      <button type="button" class="pill program" aria-label="Open practice program">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15V6"/><path d="M19 18a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M3 12h.01"/><path d="M3 6h.01"/><path d="M3 18h.01"/><path d="M8 12h9"/><path d="M8 6h13"/><path d="M8 18h4"/></svg>
        <span>Program</span>
      </button>
      <button type="button" class="play" aria-label="Start metronome">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14Z"/></svg>
      </button>
      <button type="button" class="pill tap" aria-label="Tap tempo">Tap Tempo</button>
    </footer>
  </div>
</div>
</x-dc>
</body>
</html>
