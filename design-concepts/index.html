<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BestTake design concepts</title>
    <style>
      :root {
        --ink: #e8edf5;
        --muted: #8b95a7;
        --chip: #1b2433;
        --chip-on: #f7a600;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #0c1118; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100dvh;
        padding: 1rem 1rem 1.1rem;
      }
      header { text-align: center; }
      header p { margin: 0; color: var(--muted); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
      header h1 { margin: 0.28rem 0 0.85rem; font-size: 1.15rem; letter-spacing: -0.03em; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.42rem; }
      button {
        border: 0;
        border-radius: 999px;
        padding: 0.48rem 0.78rem;
        background: var(--chip);
        color: #d5dbe6;
        font: inherit;
        font-size: 0.74rem;
        font-weight: 650;
        cursor: pointer;
      }
      button[aria-current="true"] { background: var(--chip-on); color: #1a1203; }
      main {
        display: grid;
        place-items: center;
        min-height: 0;
        padding: 0.8rem 0;
      }
      canvas { width: min(100%, 430px); height: auto; max-height: calc(100dvh - 11rem); }
      footer { max-width: 34rem; margin: 0 auto; color: var(--muted); font-size: 0.78rem; line-height: 1.45; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <p>Canvas concepts</p>
      <h1>BestTake · Home marks, Metronome, Games</h1>
      <nav>
        <button type="button" data-scene="home" aria-current="true">Home logos</button>
        <button type="button" data-scene="marks">Logo set</button>
        <button type="button" data-scene="metronome">Metronome</button>
        <button type="button" data-scene="travel">Travel in</button>
        <button type="button" data-scene="arcade">Games lobby</button>
      </nav>
    </header>
    <main>
      <canvas id="stage" width="860" height="1760" aria-label="BestTake design concept"></canvas>
    </main>
    <footer id="caption">Custom Audio, Metronome, Tuner, and Games marks on the existing Home layout.</footer>
    <script>
      const GOLD = "#f7a600";
      const BLUE = "#1598ff";
      const INK = "#171a22";
      const MUTED = "#6c7077";
      const PAPER = "#f7f8fa";
      const SURFACE = "#ffffff";

      const captions = {
        home: "Existing Home layout, with a custom four-mark dock for Audio, Metronome, Tuner, and Games.",
        marks: "One stroke family: waveform, pendulum, tuning fork, smooth gamepad. Not generic icons.",
        metronome: "One paper color under the transport, and tighter Time / Rhythm / Sound / View fields.",
        travel: "Entering Games is a rush into the world — clouds, rope, and depth — not a settings sheet.",
        arcade: "Practice Games lobby as a polished Apple Arcade board, not a Game Boy menu.",
      };

      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const buttons = [...document.querySelectorAll("nav button")];
      const caption = document.getElementById("caption");

      let scene = "home";
      let travelStart = performance.now();
      let raf = 0;

      const W = canvas.width;
      const H = canvas.height;
      const phone = { x: 48, y: 36, w: W - 96, h: H - 72, r: 72 };

      function roundRect(x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function fillRound(x, y, w, h, r, color) {
        ctx.fillStyle = color;
        roundRect(x, y, w, h, r);
        ctx.fill();
      }

      function strokeRound(x, y, w, h, r, color, width = 2) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        roundRect(x, y, w, h, r);
        ctx.stroke();
      }

      function text(str, x, y, size, color, align = "center", weight = "600") {
        ctx.fillStyle = color;
        ctx.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif`;
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        ctx.fillText(str, x, y);
      }

      function phoneShell(fill = PAPER) {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#101722";
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.45)";
        ctx.shadowBlur = 40;
        ctx.shadowOffsetY = 18;
        fillRound(phone.x, phone.y, phone.w, phone.h, phone.r, "#0b0f14");
        ctx.restore();
        fillRound(phone.x + 10, phone.y + 10, phone.w - 20, phone.h - 20, 62, fill);
        fillRound(phone.x + 292, phone.y + 28, 180, 28, 16, "#11161d");
        text("9:41", phone.x + 78, phone.y + 44, 22, INK, "left", "700");
      }

      function drawWaveform(cx, cy, color, scale = 1) {
        const bars = [10, 18, 28, 18, 10];
        bars.forEach((h, i) => {
          const x = cx - 34 * scale + i * 17 * scale;
          fillRound(x, cy - (h * scale) / 2, 8 * scale, h * scale, 4 * scale, color);
        });
      }

      function drawMetronomeMark(cx, cy, color, scale = 1) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 3.2;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(-22, 22);
        ctx.lineTo(22, 22);
        ctx.moveTo(-17, 22);
        ctx.lineTo(-4, -18);
        ctx.lineTo(4, -18);
        ctx.lineTo(17, 22);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -16);
        ctx.lineTo(11, 8);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(11, 10, 3.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawFork(cx, cy, color, scale = 1) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        ctx.strokeStyle = color;
        ctx.lineWidth = 3.2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0, 20);
        ctx.lineTo(0, 4);
        ctx.moveTo(-9, -18);
        ctx.lineTo(-9, -2);
        ctx.quadraticCurveTo(-9, 4, 0, 4);
        ctx.quadraticCurveTo(9, 4, 9, -2);
        ctx.lineTo(9, -18);
        ctx.stroke();
        ctx.restore();
      }

      function drawPad(cx, cy, color, scale = 1) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        ctx.strokeStyle = color;
        ctx.lineWidth = 3.2;
        ctx.lineJoin = "round";
        fillRound(-22, -12, 44, 24, 10, "transparent");
        strokeRound(-22, -12, 44, 24, 10, color, 3.2);
        ctx.beginPath();
        ctx.moveTo(-8, -3);
        ctx.lineTo(-8, 5);
        ctx.moveTo(-12, 1);
        ctx.lineTo(-4, 1);
        ctx.moveTo(9, -2);
        ctx.arc(9, 2, 2.4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      function drawHome() {
        phoneShell(PAPER);
        const x = phone.x + 10;
        const y = phone.y + 10;
        const w = phone.w - 20;

        fillRound(x + 36, y + 70, w - 72, 64, 32, SURFACE);
        ["Audio", "Metronome", "Tuner", "Games"].forEach((label, i) => {
          const bx = x + 44 + i * 170;
          if (i === 0) strokeRound(bx, y + 78, 154, 48, 24, GOLD, 3);
          text(label, bx + 77, y + 102, 20, i === 0 ? GOLD : MUTED, "center", "650");
        });

        ctx.beginPath();
        ctx.arc(x + w / 2, y + 390, 118, 0, Math.PI * 2);
        ctx.fillStyle = SURFACE;
        ctx.fill();
        ctx.strokeStyle = "rgba(23,26,34,0.08)";
        ctx.lineWidth = 8;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + w / 2, y + 390, 118, -Math.PI * 0.85, -Math.PI * 0.15);
        ctx.strokeStyle = GOLD;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + w / 2, y + 390, 118, Math.PI * 0.15, Math.PI * 0.85);
        ctx.strokeStyle = BLUE;
        ctx.stroke();
        const mx = x + w / 2;
        fillRound(mx - 22, y + 336, 44, 68, 22, INK);
        ctx.strokeStyle = INK;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(mx, y + 390, 34, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(mx, y + 424);
        ctx.lineTo(mx, y + 444);
        ctx.stroke();
        fillRound(mx - 16, y + 442, 32, 6, 3, INK);
        text("Ready to record", x + w / 2, y + 545, 28, INK, "center", "700");
        text("Tap the red button when you are set.", x + w / 2, y + 580, 18, MUTED);

        const cards = [
          { title: "Best Take", tone: GOLD, left: x + 36 },
          { title: "Current Take", tone: BLUE, left: x + w / 2 + 8 },
        ];
        cards.forEach((card) => {
          fillRound(card.left, y + 630, w / 2 - 44, 210, 28, SURFACE);
          text(card.title, card.left + 24, y + 662, 18, MUTED, "left", "700");
          for (let i = 0; i < 18; i += 1) {
            const h = 18 + Math.abs(Math.sin(i * 0.7)) * 70;
            fillRound(card.left + 22 + i * 14, y + 760 - h / 2, 7, h, 4, card.tone);
          }
        });

        const marks = [
          { label: "Audio", draw: drawWaveform, color: BLUE },
          { label: "Metronome", draw: drawMetronomeMark, color: GOLD },
          { label: "Tuner", draw: drawFork, color: INK },
          { label: "Games", draw: drawPad, color: GOLD },
        ];
        marks.forEach((mark, i) => {
          const mx = x + 88 + i * 168;
          const my = y + 960;
          ctx.save();
          ctx.shadowColor = "rgba(23,26,34,0.08)";
          ctx.shadowBlur = 16;
          fillRound(mx - 48, my - 48, 96, 96, 48, SURFACE);
          ctx.restore();
          mark.draw(mx, my, mark.color, 1.15);
          text(mark.label, mx, my + 72, 16, MUTED);
        });

        fillRound(x + 40, y + 1088, w - 80, 118, 59, "#121826");
        text("Vault", x + 118, y + 1148, 16, "#d7dde8");
        text("Overlays", x + 230, y + 1148, 16, "#d7dde8");
        ctx.beginPath();
        ctx.arc(x + w / 2, y + 1147, 34, 0, Math.PI * 2);
        ctx.fillStyle = "#e11d2e";
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#fff";
        ctx.stroke();
        text("Camera", x + 548, y + 1148, 16, "#d7dde8");
        text("Settings", x + 668, y + 1148, 16, "#d7dde8");
      }

      function drawMarks() {
        phoneShell("#eef1f6");
        const x = phone.x + 10;
        const y = phone.y + 10;
        const w = phone.w - 20;
        text("TOOL MARKS", x + w / 2, y + 120, 18, GOLD);
        text("One family. Four jobs.", x + w / 2, y + 168, 36, INK, "center", "750");
        text("Custom marks for the Home dock — not Lucide defaults.", x + w / 2, y + 214, 20, MUTED);

        const items = [
          { label: "Audio", draw: drawWaveform, color: BLUE, note: "Live take energy" },
          { label: "Metronome", draw: drawMetronomeMark, color: GOLD, note: "Pendulum, not a clock" },
          { label: "Tuner", draw: drawFork, color: INK, note: "Pitch reference" },
          { label: "Games", draw: drawPad, color: GOLD, note: "Smooth, not pixel" },
        ];
        items.forEach((item, i) => {
          const col = i % 2;
          const row = Math.floor(i / 2);
          const cx = x + 190 + col * 360;
          const cy = y + 430 + row * 380;
          ctx.save();
          ctx.shadowColor = "rgba(23,26,34,0.1)";
          ctx.shadowBlur = 28;
          fillRound(cx - 150, cy - 150, 300, 300, 48, SURFACE);
          ctx.restore();
          fillRound(cx - 58, cy - 86, 116, 116, 58, PAPER);
          item.draw(cx, cy - 28, item.color, 1.7);
          text(item.label, cx, cy + 68, 26, INK, "center", "750");
          text(item.note, cx, cy + 102, 16, MUTED);
        });
      }

      function drawMetronome() {
        phoneShell(PAPER);
        const x = phone.x + 10;
        const y = phone.y + 10;
        const w = phone.w - 20;
        fillRound(x + 36, y + 70, w - 72, 64, 32, SURFACE);
        text("Audio", x + 130, y + 102, 20, MUTED);
        strokeRound(x + 210, y + 78, 170, 48, 24, GOLD, 3);
        text("Metronome", x + 295, y + 102, 20, GOLD, "center", "650");
        text("Tuner", x + 470, y + 102, 20, MUTED);
        text("Games", x + 620, y + 102, 20, MUTED);

        text("♩ = BPM", x + w / 2, y + 200, 16, MUTED);
        text("120", x + w / 2, y + 268, 84, INK, "center", "750");
        text("Tempo", x + w / 2, y + 330, 18, MUTED);

        const fields = ["Time  4/4", "Rhythm  Quarter", "Sound  Wood", "View  Bars"];
        fields.forEach((label, i) => {
          const col = i % 2;
          const row = Math.floor(i / 2);
          const fx = x + 48 + col * 340;
          const fy = y + 380 + row * 92;
          fillRound(fx, fy, 320, 80, 18, SURFACE);
          strokeRound(fx, fy, 320, 80, 18, "rgba(23,26,34,0.1)", 1.5);
          const [k, v] = label.split("  ");
          text(k, fx + 18, fy + 24, 14, MUTED, "left", "700");
          text(v, fx + 18, fy + 52, 22, INK, "left", "650");
        });

        [0, 1, 2, 3].forEach((i) => {
          const bx = x + 86 + i * 150;
          fillRound(bx, y + 620, 92, 160, 16, i === 0 ? GOLD : SURFACE);
          strokeRound(bx, y + 620, 92, 160, 16, i === 0 ? GOLD : "rgba(23,26,34,0.1)", 2);
          text(String(i + 1), bx + 46, y + 800, 18, i === 0 ? "#fff" : MUTED);
        });

        fillRound(x + 70, y + 860, 200, 72, 36, SURFACE);
        text("Program", x + 170, y + 896, 20, INK);
        ctx.beginPath();
        ctx.arc(x + w / 2, y + 896, 42, 0, Math.PI * 2);
        ctx.fillStyle = SURFACE;
        ctx.fill();
        ctx.strokeStyle = BLUE;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + w / 2 - 8, y + 880);
        ctx.lineTo(x + w / 2 + 16, y + 896);
        ctx.lineTo(x + w / 2 - 8, y + 912);
        ctx.closePath();
        ctx.fillStyle = BLUE;
        ctx.fill();
        fillRound(x + w - 270, y + 860, 200, 72, 36, SURFACE);
        text("Tap Tempo", x + w - 170, y + 896, 20, INK);

        fillRound(x + 24, y + 980, w - 48, 240, 28, PAPER);
        text("One paper color through the footer.", x + w / 2, y + 1060, 22, INK, "center", "700");
        text("No second white band under the controls.", x + w / 2, y + 1100, 18, MUTED);
      }

      function drawTravel(now) {
        const t = ((now - travelStart) / 2200) % 1;
        const ease = t < 0.7 ? t / 0.7 : 1;
        phoneShell("#8ec8ef");
        const x = phone.x + 10;
        const y = phone.y + 10;
        const w = phone.w - 20;
        const h = phone.h - 20;

        const sky = ctx.createLinearGradient(0, y, 0, y + h);
        sky.addColorStop(0, "#6eb6e8");
        sky.addColorStop(0.45, "#c8edfd");
        sky.addColorStop(1, "#f6f8fb");
        ctx.fillStyle = sky;
        fillRound(x, y, w, h, 62, sky);
        ctx.save();
        roundRect(x, y, w, h, 62);
        ctx.clip();

        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.beginPath();
        ctx.arc(x + w * 0.72, y + 90, 70, 0, Math.PI * 2);
        ctx.fill();

        function cloud(cx, cy, s) {
          ctx.fillStyle = "rgba(255,255,255,0.92)";
          ctx.beginPath();
          ctx.ellipse(cx, cy, 70 * s, 22 * s, 0, 0, Math.PI * 2);
          ctx.ellipse(cx - 40 * s, cy + 4 * s, 36 * s, 16 * s, 0, 0, Math.PI * 2);
          ctx.ellipse(cx + 42 * s, cy + 6 * s, 32 * s, 14 * s, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        cloud(x + 160, y + 220 + ease * -180, 1.1 + ease * 0.8);
        cloud(x + 520, y + 310 + ease * -260, 1.4 + ease * 1.1);
        cloud(x + 240, y + 520 + ease * -340, 1.8 + ease * 1.4);
        cloud(x + 580, y + 680 + ease * -420, 2.1 + ease * 1.8);

        ctx.strokeStyle = GOLD;
        ctx.lineWidth = 6 + ease * 10;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x + w / 2, y + 980);
        ctx.lineTo(x + w / 2, y + 280 - ease * 80);
        ctx.stroke();

        ctx.fillStyle = "#f3a32a";
        ctx.beginPath();
        ctx.ellipse(x + w / 2, y + 250 - ease * 40, 90 + ease * 40, 28 + ease * 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#7ec4ee";
        ctx.beginPath();
        ctx.moveTo(x + w / 2 - 70, y + 250);
        ctx.lineTo(x + w / 2 + 70, y + 250);
        ctx.lineTo(x + w / 2 + 40, y + 330);
        ctx.lineTo(x + w / 2 - 40, y + 330);
        ctx.closePath();
        ctx.fill();

        const fade = ctx.createRadialGradient(x + w / 2, y + h / 2, 80, x + w / 2, y + h / 2, 420);
        fade.addColorStop(0, "rgba(12,22,38,0)");
        fade.addColorStop(1, "rgba(12,22,38,0.28)");
        ctx.fillStyle = fade;
        ctx.fillRect(x, y, w, h);
        ctx.restore();
        text("Traveling into Balance", x + w / 2, y + 1180, 24, INK, "center", "750");
      }

      function drawArcade() {
        phoneShell("#f4f6fb");
        const x = phone.x + 10;
        const y = phone.y + 10;
        const w = phone.w - 20;
        fillRound(x + 36, y + 78, 72, 72, 22, GOLD);
        drawPad(x + 72, y + 114, "#fff", 1.05);
        text("Practice Games", x + 128, y + 100, 26, INK, "left", "750");
        text("BestTake", x + 128, y + 132, 16, MUTED, "left", "700");
        text("Play your instrument", x + 48, y + 200, 16, GOLD, "left", "800");
        text("Choose a game", x + 48, y + 248, 44, INK, "left", "750");
        text("Your microphone hears every note.", x + 48, y + 300, 20, MUTED, "left");

        fillRound(x + 36, y + 360, w - 72, 280, 32, SURFACE);
        fillRound(x + 56, y + 384, 150, 36, 18, "#e4f3ff");
        text("Sight reading", x + 131, y + 402, 14, "#126ca8");
        text("Staff Jumper", x + 56, y + 456, 30, INK, "left", "750");
        text("Read the note and hop it across the staff.", x + 56, y + 498, 18, MUTED, "left");
        fillRound(x + w - 250, y + 392, 180, 216, 24, "#e8f3fd");
        for (let i = 0; i < 5; i += 1) {
          ctx.fillStyle = "rgba(31,95,139,0.28)";
          ctx.fillRect(x + w - 236, y + 430 + i * 28, 152, 2);
        }

        fillRound(x + 36, y + 668, w - 72, 280, 32, SURFACE);
        fillRound(x + 56, y + 692, 130, 36, 18, "#e1f5ea");
        text("Long tones", x + 121, y + 710, 14, "#247457");
        text("Balance", x + 56, y + 764, 30, INK, "left", "750");
        text("Hold the note in tune to keep moving.", x + 56, y + 806, 18, MUTED, "left");
        const artX = x + w - 250;
        const sky = ctx.createLinearGradient(0, y + 700, 0, y + 916);
        sky.addColorStop(0, "#9ed4f2");
        sky.addColorStop(1, "#d5efc8");
        fillRound(artX, y + 700, 180, 216, 24, "#9ed4f2");
        ctx.fillStyle = sky;
        roundRect(artX, y + 700, 180, 216, 24);
        ctx.fill();
        ctx.strokeStyle = GOLD;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(artX + 90, y + 890);
        ctx.lineTo(artX + 90, y + 760);
        ctx.stroke();
      }

      function render(now) {
        if (scene === "home") drawHome();
        else if (scene === "marks") drawMarks();
        else if (scene === "metronome") drawMetronome();
        else if (scene === "travel") drawTravel(now);
        else drawArcade();
        if (scene === "travel") raf = requestAnimationFrame(render);
      }

      function setScene(next) {
        scene = next;
        caption.textContent = captions[next];
        buttons.forEach((button) => button.setAttribute("aria-current", String(button.dataset.scene === next)));
        cancelAnimationFrame(raf);
        if (next === "travel") travelStart = performance.now();
        raf = requestAnimationFrame(render);
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => setScene(button.dataset.scene));
      });

      setScene("home");
    </script>
  </body>
</html>
